#   [test] static code analysis (linting)
lint
    eslint --config etc/eslint.mjs src/*.ts && \
    tsc --project etc/tsc.json

#   [test] run the skill test harness (arguments: case globs and options)
test
    node --import tsx src/ase-test.ts $*

#   [test] remove regularly built files
clean
    shx rm -rf results

#   [test] remove all built files
distclean: clean
    shx rm -f package-lock.json && \
    shx rm -rf node_modules
