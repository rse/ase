#   [tool] static code analysis (linting)
lint
    eslint --config etc/eslint.mjs src/*.ts src/ase-agent-definition-builtin/*.ts src/*.vue && \
    vue-tsc --project etc/tsc-client.json

#   [tool] static code analysis (linting) with file watching
lint-watch
    nodemon --exec "npm start lint" --watch src --ext ts,vue

#   [tool] code compilation/transpiling (building) with file watching
build-watch
    nodemon --exec "npm start build" --watch src --ext ts,vue,styl,html

#   [tool] build entire project
build : lint build-cmd build-man build-plugin

#   [tool] build command program (and its public types, and the browser client of the web board)
build-cmd
    tsc --project etc/tsc.json && \
    tsc --project etc/tsc-api.json && \
    vite build --config etc/vite.mts

#   [tool] copy Markdown manual pages man/*.md into package for the manual page browser
build-man
    shx rm -rf dst/man && \
    shx mkdir -p dst/man && \
    shx cp man/*.md dst/man/

#   [tool] copy plugin directory into package for bundling
build-plugin
    syncdir ../plugin plugin --quiet --deleteOrphaned \
        --exclude node_modules /package.json /etc/ /.gitignore && \
    syncdir ../.claude-plugin .claude-plugin --quiet --deleteOrphaned

#   [tool] build container image (multi-architecture, pushed to registry)
build-container : build
    version="$(node -p "require('./package.json').version")" && \
    context="$(mktemp -d)" && \
    npm pack --pack-destination "$context" && \
    shx cp etc/ase-entrypoint.sh "$context/" && \
    docker buildx build \
        --file etc/ase.dockerfile \
        --platform linux/amd64,linux/arm64 \
        --build-arg ASE_VERSION="$version" \
        --tag ghcr.io/rse/ase:"$version" \
        --tag ghcr.io/rse/ase:latest \
        --push \
        "$context" && \
    shx rm -rf "$context"

#   [tool] remove regularly built files
clean
    shx rm -rf dst plugin

#   [tool] remove all built files
distclean: clean
    shx rm -f package-lock.json
    shx rm -rf node_modules

